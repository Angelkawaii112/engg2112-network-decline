  licence: CC BY 4.0
  expected_layer: STE_2021_AUST_GDA2020
  expected_state_field: STE_NAME21

remoteness:
  publisher: Australian Bureau of Statistics (ABS)
  title: Remoteness Area 2021, GeoPackage, GDA2020
  url: https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs/edition-3-july-2021-june-2026/access-and-downloads/digital-boundary-files/ASGS_Ed3_2021_RA_GPKG_GDA2020.zip
