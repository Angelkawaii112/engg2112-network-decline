coverage:
  publisher: Australian Competition and Consumer Commission (ACCC)
  catalogue: https://data.gov.au/data/dataset/accc-mobile-infrastructure-report-data-release
  report: https://www.accc.gov.au/by-industry/telecommunications-and-internet/mobile-services-regulation/mobile-infrastructure-report/mobile-infrastructure-report-2026
  report_release_date: 2026-09-22
  map_reference_date: 2026-01-31
  map_type: 4G outdoor predicted coverage
  files_supplied_locally:
    - coverage-map-telstra-4g-outdoor-2026.kml
    - coverage-map-optus-4g-outdoor-2026.zip
    - coverage-map-tpg-4g-outdoor-2026.kml
  notes:
    - ACCC says the released maps do not reflect the standardised approach that took effect on 2026-06-30.
    - Operators use different modelling assumptions; cross-operator comparison has limitations.
    - Telstra revised its 4G outdoor mapping method in 2024 after identifying an underestimation issue in its 2022/2023 submissions.

population:
  publisher: Australian Bureau of Statistics (ABS)
  title: Australian population grid 2025, GeoTIFF
  reference_period: ERP at 2025-06-30
  url: https://www.abs.gov.au/statistics/people/population/regional-population/2024-25/GEOTIFF.zip
  landing_page: https://www.abs.gov.au/statistics/people/population/regional-population/2024-25
  notes:
    - 1 km grid; modelled population allocated to residential locations, not a direct count at each cell.
    - Population is assigned to gap cells by cell-centre coverage classification.

state_boundary:
  publisher: Australian Bureau of Statistics (ABS)
  title: States and Territories 2021, Shapefile, GDA2020
  url: https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs/edition-3-july-2021-june-2026/access-and-downloads/digital-boundary-files/STE_2021_AUST_SHP_GDA2020.zip
